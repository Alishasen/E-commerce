{% extends "products/storefront/base.html" %}

{% block title %}
Payment Successful | KHOJ
{% endblock %}

{% block content %}

<main class="container py-5">

    <div class="text-center">

        <div class="mb-4">
            <i class="bi bi-check-circle-fill fs-1"></i>
        </div>

        <h1 class="fw-bold">
            Payment Successful!
        </h1>

        <p class="text-muted">
            Thank you for your order.
        </p>

        <p>
            Order #{{ order.id }}
        </p>

        <h4 class="fw-bold">
            Rs. {{ order.total_amount }}
        </h4>

        <a
            href="{% url 'products:storefront_product_list' %}"
            class="btn btn-dark mt-4"
        >
            Continue Shopping
        </a>

    </div>

</main>

{% endblock %}
