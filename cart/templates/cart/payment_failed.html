{% extends "products/storefront/base.html" %}

{% block title %}
Payment Failed | KHOJ
{% endblock %}

{% block content %}

<main class="container py-5">

    <div class="text-center">

        <div class="mb-4">
            <i class="bi bi-x-circle-fill fs-1"></i>
        </div>

        <h1 class="fw-bold">
            Payment Not Completed
        </h1>

        <p class="text-muted">
            {{ message }}
        </p>

        <a
            href="{% url 'cart:cart_detail' %}"
            class="btn btn-dark mt-4"
        >
            Return to Cart
        </a>

    </div>

</main>

{% endblock %}
