<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Redirecting to eSewa | KHOJ
    </title>

</head>

<body>

    <div
        style="
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        "
    >

        <div style="text-align: center;">

            <h2>
                Redirecting to eSewa...
            </h2>

            <p>
                Please wait while we connect you to eSewa.
            </p>

            <form
                id="esewaForm"
                method="POST"
                action="{{ payment_url }}"
            >

                <input
                    type="hidden"
                    name="amount"
                    value="{{ amount }}"
                >

                <input
                    type="hidden"
                    name="tax_amount"
                    value="{{ tax_amount }}"
                >

                <input
                    type="hidden"
                    name="total_amount"
                    value="{{ total_amount }}"
                >

                <input
                    type="hidden"
                    name="transaction_uuid"
                    value="{{ transaction_uuid }}"
                >

                <input
                    type="hidden"
                    name="product_code"
                    value="{{ product_code }}"
                >

                <input
                    type="hidden"
                    name="product_service_charge"
                    value="{{ product_service_charge }}"
                >

                <input
                    type="hidden"
                    name="product_delivery_charge"
                    value="{{ product_delivery_charge }}"
                >

                <input
                    type="hidden"
                    name="success_url"
                    value="{{ success_url }}"
                >

                <input
                    type="hidden"
                    name="failure_url"
                    value="{{ failure_url }}"
                >

                <input
                    type="hidden"
                    name="signed_field_names"
                    value="{{ signed_field_names }}"
                >

                <input
                    type="hidden"
                    name="signature"
                    value="{{ signature }}"
                >

            </form>

        </div>

    </div>


    <script>

        document
            .getElementById("esewaForm")
            .submit();

    </script>

</body>

</html>
