{% extends "products/storefront/base.html" %}

{% block title %}Login | KHOJ{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card border-0 shadow-sm rounded-4">

                <div class="card-body p-4 p-md-5">

                    <h2 class="fw-bold mb-2">
                        Welcome back
                    </h2>

                    <p class="text-muted mb-4">
                        Login to continue shopping.
                    </p>


                    {% if error %}

                        <div class="alert alert-danger">
                            {{ error }}
                        </div>

                    {% endif %}


                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn primary-btn w-100"
                        >
                            Login
                        </button>

                    </form>


                    <p class="text-center text-muted mt-4 mb-0">

                        Don't have an account?

                        <a href="{% url 'accounts:register' %}">
                            Sign up
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
